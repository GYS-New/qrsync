[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.openpyxl", "python311Packages.pillow"]

[phases.install]
cmds = [
  "npm install --legacy-peer-deps",
  "python3.11 -m pip install qrcode openpyxl pillow --break-system-packages || true"
]

[phases.build]
cmds = [
  "ln -sf $(which python3.11) /usr/local/bin/python3 || true",
  "npm run build"
]

[start]
cmd = "npm start"
